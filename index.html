<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World Clock</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>World Clock</h1>
      <select id="city-select">
        <option value="select-a-city">Select a city...</option>
         <option value="current">My current location</option>
        <option value="Europe/Vienna">Vienna</option>
        <option value="Europe/Berlin">Berlin</option>
        <option value="Europe/Dublin">Dublin</option>
      </select>
      <div  id="city-container">
      <div class="city" id="los-angeles">
        <div class="city-specifications">
          <h2 id="los-angeles">Los Angeles</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>

  <div class="city" id="paris">
        <div class="city-specifications">
          <h2 id="paris">Paris</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>
 

  <div class="city" id="tokio">
        <div class="city-specifications">
          <h2 id="tokio">Tokio</h2>
          <div class="date"></div>
        </div>
        <div class="time"></div>
      </div>
    </div>
  </div> 
</div>
</div> 
</div>
    <footer>
      This project was coded by Sofija Krulj and is
      <a
        href="https://github.com/Sofija-Krulj/world-clock-assisted-project"
        target="_blank"
        >open sourced on GitHub</a
      >
    </footer>
    <script src="javascript/index.js"></script>
  </body>
</html>
